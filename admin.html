<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Админка приглашений</title>
<style>
:root {
    --bg: #0a0d1f; --panel: #10142a; --panel-2: #161b38;
    --line: rgba(255,255,255,.09); --line-strong: rgba(255,255,255,.18);
    --text: #eef1ff; --dim: #8b94b8;
    --accent: #7c93ff; --accent-soft: rgba(124,147,255,.14);
    --ok: #58d68d; --danger: #ff6b8a; --warn: #f4c95d;
    color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
    background: radial-gradient(1000px 600px at 50% -10%, #1a2355 0%, var(--bg) 60%) fixed;
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; }

/* шапка и вкладки */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 22px; }
header h1 { font-size: 20px; font-weight: 650; letter-spacing: -.01em; flex: 1 1 auto; }
nav { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
nav button { background: none; border: 0; padding: 8px 14px; border-radius: 10px; color: var(--dim); }
nav button[aria-selected="true"] { background: var(--accent-soft); color: var(--text); }
.link-btn { background: none; border: 0; color: var(--dim); padding: 8px 4px; }
.link-btn:hover { color: var(--text); }

/* блоки */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
.panel h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } }
.muted { color: var(--dim); font-size: 13px; }
.empty { color: var(--dim); padding: 18px 4px; text-align: center; }

/* воронка */
.funnel { display: grid; gap: 14px; }
.f-row .f-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.f-row .f-num { font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
.f-bar { height: 8px; background: var(--panel-2); border-radius: 8px; overflow: hidden; }
.f-bar i { display: block; height: 100%; background: var(--accent); border-radius: 8px; min-width: 2px; }
.f-row:nth-child(3) .f-bar i { background: var(--ok); }
.f-row:nth-child(4) .f-bar i { background: var(--warn); }

/* график */
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 8px; font-size: 13px; color: var(--dim); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--dim); font-size: 11px; }

/* бары мест */
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 120px 1fr 36px; align-items: center; gap: 10px; font-size: 14px; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 8px; background: var(--panel-2); border-radius: 8px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; background: var(--accent); border-radius: 8px; }
.bar-row .cnt { text-align: right; color: var(--dim); }

/* события */
.events { list-style: none; display: grid; gap: 2px; }
.events li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.events li:last-child { border-bottom: 0; }
.events time { color: var(--dim); white-space: nowrap; font-size: 13px; }

/* таблица */
.tools { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.tools input, .tools select, .field {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0;
}
.tools input { flex: 1 1 200px; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 640px; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--dim); font-size: 13px; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td .sub { color: var(--dim); font-size: 12.5px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12.5px; background: var(--panel-2); color: var(--dim); }
.badge.open { background: var(--accent-soft); color: var(--accent); }
.badge.done { background: rgba(88,214,141,.14); color: var(--ok); }
.row-actions { display: flex; gap: 6px; white-space: nowrap; }

/* кнопки */
.btn { border: 1px solid var(--line-strong); background: var(--panel-2); border-radius: 10px; padding: 8px 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0a0d1f; font-weight: 600; }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.btn.small { padding: 5px 10px; font-size: 13px; }

/* места */
.place-row { display: grid; grid-template-columns: 64px 1.1fr 1.3fr 1.3fr auto; gap: 8px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.place-row:last-of-type { border-bottom: 0; }
.place-row.off { opacity: .55; }
.place-row .field { width: 100%; }
.place-row .emoji { text-align: center; font-size: 18px; }
.place-ctrl { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.place-ctrl label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); white-space: nowrap; }
@media (max-width: 760px) {
    .place-row { grid-template-columns: 64px 1fr; }
    .place-row .field.desc, .place-row .field.addr, .place-ctrl { grid-column: 1 / -1; }
    .place-ctrl { justify-content: flex-start; }
}
.save-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; }

/* вход */
.login { max-width: 340px; margin: 18vh auto 0; }
.login .field { width: 100%; margin: 12px 0; }
.err { color: var(--danger); font-size: 14px; min-height: 21px; }

/* уведомление */
#toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 16px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; max-width: 90vw; }
#toast.show { opacity: 1; }
#toast.error { border-color: var(--danger); color: var(--danger); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
    'use strict';

    const root = document.getElementById('root');
    let password = '';
    let data = null;           // ответ /api/admin?action=overview
    let tab = 'overview';
    let draftPlaces = [];      // редактируемая копия мест
    let dirty = false;
    let filterText = '', filterStatus = 'all';

    try { password = sessionStorage.getItem('adm') || ''; } catch (e) { /* storage недоступен */ }

    // ---------- helpers ----------
    function h(tag, props, ...kids) {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(props || {})) {
            if (v === null || v === undefined || v === false) continue;
            if (k === 'class') el.className = v;
            else if (k === 'text') el.textContent = v;
            else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
            else if (k === 'value' || k === 'checked' || k === 'disabled') el[k] = v;
            else el.setAttribute(k, v === true ? '' : v);
        }
        kids.flat().forEach((c) => { if (c !== null && c !== undefined && c !== false) el.append(c); });
        return el;
    }

    function toast(msg, type) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'show ' + (type || '');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => { t.className = ''; }, 3000);
    }

    const fmtDT = (ts) => ts ? new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
    const fmtDay = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '—');

    async function api(action, body) {
        const res = await fetch('/api/admin?action=' + action, {
            method: body ? 'POST' : 'GET',
            headers: { 'x-admin-password': password, 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined,
        });
        const json = await res.json().catch(() => ({}));
        if (res.status === 401) { logout(); throw new Error(json.error || 'Неверный пароль'); }
        if (!res.ok || !json.ok) throw new Error(json.error || 'Ошибка ' + res.status);
        return json;
    }

    function logout() {
        password = '';
        try { sessionStorage.removeItem('adm'); } catch (e) { /* ignore */ }
        data = null;
        renderLogin();
    }

    // ---------- вход ----------
    function renderLogin(message) {
        const input = h('input', { class: 'field', type: 'password', placeholder: 'Пароль', autocomplete: 'current-password', 'aria-label': 'Пароль' });
        const err = h('p', { class: 'err', text: message || '' });
        const submit = async () => {
            password = input.value;
            err.textContent = '';
            try {
                await load();
                try { sessionStorage.setItem('adm', password); } catch (e) { /* ignore */ }
            } catch (e) {
                password = '';
                renderLogin(e.message);
            }
        };
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
        root.replaceChildren(h('div', { class: 'login panel' },
            h('h2', { text: 'Админка приглашений' }),
            input, err,
            h('button', { class: 'btn primary', text: 'Войти', onclick: submit })
        ));
        input.focus();
    }

    async function load() {
        data = await api('overview');
        if (!dirty) draftPlaces = data.places.map((p) => ({ ...p }));
        render();
    }

    // ---------- каркас ----------
    function render() {
        const tabs = [['overview', 'Статистика'], ['invites', 'Приглашения'], ['places', 'Места']];
        const body = tab === 'overview' ? viewOverview() : tab === 'invites' ? viewInvites() : viewPlaces();

        root.replaceChildren(
            h('header', {},
                h('h1', { text: 'Админка приглашений' }),
                h('nav', { role: 'tablist' }, tabs.map(([id, label]) =>
                    h('button', { role: 'tab', 'aria-selected': String(tab === id), text: label, onclick: () => { tab = id; render(); } }))),
                h('button', { class: 'link-btn', text: 'Обновить', onclick: () => load().then(() => toast('Обновлено')).catch((e) => toast(e.message, 'error')) }),
                h('button', { class: 'link-btn', text: 'Выйти', onclick: logout })
            ),
            body
        );
    }

    // ---------- статистика ----------
    function viewOverview() {
        const t = data.totals;
        const steps = [
            ['Создано ссылок', t.created, t.created, null],
            ['Открыто', t.open, t.created, t.created],
            ['Ответили «Да»', t.answer, t.created, t.open],
            ['Отправили записку', t.note, t.created, t.answer],
        ];

        const funnel = h('div', { class: 'funnel' }, steps.map(([label, n, base, prev]) =>
            h('div', { class: 'f-row' },
                h('div', { class: 'f-top' },
                    h('span', { text: label }),
                    h('span', { class: 'f-num', text: String(n) })),
                h('div', { class: 'f-bar' }, h('i', { style: `width:${base ? Math.max(0, Math.min(100, (n / base) * 100)) : 0}%` })),
                prev !== null ? h('div', { class: 'muted', text: `${pct(n, prev)} от предыдущего шага` }) : null
            )));

        const maxPlace = Math.max(1, ...data.placeStats.map((p) => p.count));
        const places = data.placeStats.length
            ? h('div', { class: 'bars' }, data.placeStats.map((p) =>
                h('div', { class: 'bar-row' },
                    h('span', { class: 'name', text: `${p.emoji || ''} ${p.name}${p.removed ? ' (удалено)' : ''}`.trim() }),
                    h('div', { class: 'track' }, h('i', { style: `width:${(p.count / maxPlace) * 100}%` })),
                    h('span', { class: 'cnt', text: String(p.count) }))))
            : h('p', { class: 'empty', text: 'Пока никто не выбрал место.' });

        const labels = { created: 'создана ссылка', open: 'приглашение открыто', no: 'нажато «Нет»', answer: 'получен ответ «Да»', note: 'отправлена записка' };
        const events = data.events.length
            ? h('ul', { class: 'events' }, data.events.slice(0, 15).map((e) =>
                h('li', {},
                    h('span', { text: `${e.from || '?'} → ${e.to || '?'}: ${labels[e.e] || e.e}` }),
                    h('time', { text: fmtDT(e.t) }))))
            : h('p', { class: 'empty', text: 'Событий пока нет. Создай первое приглашение в боте: /new' });

        return h('div', {},
            h('div', { class: 'grid-2' },
                h('section', { class: 'panel' }, h('h2', { text: 'Путь приглашения' }), funnel,
                    h('p', { class: 'muted', style: 'margin-top:14px', text: `Нажатий на «Нет»: ${t.no}` })),
                h('section', { class: 'panel' }, h('h2', { text: 'Популярные места' }), places)
            ),
            h('section', { class: 'panel' }, h('h2', { text: 'Последние 14 дней' }), chart()),
            h('section', { class: 'panel' }, h('h2', { text: 'Последние события' }), events)
        );
    }

    // график: сгруппированные столбики (данные только числовые, innerHTML безопасен)
    function chart() {
        const W = 700, H = 190, padL = 28, padB = 24, padT = 8;
        const series = [['created', 'Создано', '#7c93ff'], ['open', 'Открыто', '#a9b8ff'], ['answer', 'Ответили', '#58d68d']];
        const days = data.days;
        const max = Math.max(1, ...days.flatMap((d) => series.map(([k]) => d[k] || 0)));
        const gw = (W - padL) / days.length;
        const bw = Math.min(12, (gw - 8) / 3);
        const plotH = H - padB - padT;

        let svg = '';
        [0, 0.5, 1].forEach((f) => {
            const y = padT + plotH * (1 - f);
            svg += `<line x1="${padL}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.08)"/>` +
                   `<text x="0" y="${y + 4}">${Math.round(max * f)}</text>`;
        });
        days.forEach((d, i) => {
            const x0 = padL + i * gw + (gw - bw * 3) / 2;
            series.forEach(([k, , color], j) => {
                const v = d[k] || 0;
                const bh = (v / max) * plotH;
                svg += `<rect x="${x0 + j * bw}" y="${padT + plotH - bh}" width="${bw - 1}" height="${bh}" rx="2" fill="${color}"/>`;
            });
            if (i % 2 === 0) svg += `<text x="${padL + i * gw + gw / 2}" y="${H - 6}" text-anchor="middle">${fmtDay(d.day)}</text>`;
        });

        const wrap = h('div', {},
            h('div', { class: 'legend' }, series.map(([, label, color]) => h('span', { style: `--c:${color}`, text: label }))));
        const holder = document.createElement('div');
        holder.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График по дням">${svg}</svg>`;
        wrap.append(holder);
        return wrap;
    }

    // ---------- приглашения ----------
    function statusOf(i) {
        if (i.answer) return ['done', 'Ответил' + (i.gender === 'm' ? '' : 'а')];
        if (i.openedAt) return ['open', 'Открыто'];
        return ['', 'Ждёт'];
    }

    function viewInvites() {
        const list = data.invites.filter((i) => {
            const st = i.answer ? 'done' : i.openedAt ? 'open' : 'wait';
            if (filterStatus !== 'all' && st !== filterStatus) return false;
            const q = filterText.trim().toLowerCase();
            return !q || `${i.fromName} ${i.toName}`.toLowerCase().includes(q);
        });

        const tbody = h('tbody', {}, list.map((i) => {
            const [cls, label] = statusOf(i);
            const a = i.answer;
            return h('tr', {},
                h('td', {}, h('strong', { text: i.toName }), h('div', { class: 'sub', text: 'от ' + i.fromName })),
                h('td', {}, h('span', { class: 'badge ' + cls, text: label }),
                    i.openedAt ? h('div', { class: 'sub', text: 'открыто ' + fmtDT(i.openedAt) }) : null),
                h('td', { text: fmtDT(i.createdAt) }),
                h('td', {}, a ? [h('div', { text: `${a.placeEmoji || ''} ${a.placeName}`.trim() }),
                                 h('div', { class: 'sub', text: `${a.date}, ${a.time}` })] : '—'),
                h('td', { text: `${i.noClicks} / ${i.notes}` }),
                h('td', {}, h('div', { class: 'row-actions' },
                    h('button', { class: 'btn small', text: 'Ссылка', onclick: () => copyLink(i.uid) }),
                    h('button', { class: 'btn small danger', text: 'Удалить', onclick: () => removeInvite(i) })))
            );
        }));

        return h('section', { class: 'panel' },
            h('h2', { text: `Приглашения (${data.invites.length})` }),
            h('div', { class: 'tools' },
                h('input', { type: 'search', placeholder: 'Поиск по имени', value: filterText, 'aria-label': 'Поиск',
                    oninput: (e) => { filterText = e.target.value; refreshTable(); } }),
                h('select', { 'aria-label': 'Статус', onchange: (e) => { filterStatus = e.target.value; refreshTable(); } },
                    [['all', 'Все статусы'], ['wait', 'Ждёт'], ['open', 'Открыто'], ['done', 'Ответили']]
                        .map(([v, l]) => h('option', { value: v, text: l, ...(filterStatus === v ? { selected: true } : {}) })))
            ),
            list.length
                ? h('div', { class: 'table-scroll', id: 'invTable' },
                    h('table', {},
                        h('thead', {}, h('tr', {}, ['Кому', 'Статус', 'Создано', 'Ответ', 'Нет / записки', ''].map((x) => h('th', { text: x })))),
                        tbody))
                : h('p', { class: 'empty', id: 'invTable', text: data.invites.length ? 'Ничего не найдено.' : 'Приглашений пока нет.' })
        );
    }

    function refreshTable() {
        const panel = viewInvites();
        const old = document.querySelector('#root > section.panel');
        const keep = document.activeElement && document.activeElement.type === 'search';
        old.replaceWith(panel);
        if (keep) { const s = panel.querySelector('input[type=search]'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }

    async function copyLink(uid) {
        const link = `${location.origin}/?uid=${uid}`;
        try { await navigator.clipboard.writeText(link); toast('Ссылка скопирована'); }
        catch (e) { prompt('Скопируй ссылку:', link); }
    }

    async function removeInvite(i) {
        if (!confirm(`Удалить приглашение для «${i.toName}»? Ссылка перестанет работать.`)) return;
        try { await api('delete_invite', { uid: i.uid }); await load(); toast('Приглашение удалено'); }
        catch (e) { toast(e.message, 'error'); }
    }

    // ---------- места ----------
    function markDirty() {
        dirty = true;
        const b = document.getElementById('saveBtn');
        if (b) b.disabled = false;
        const m = document.getElementById('dirtyMsg');
        if (m) m.textContent = 'Есть несохранённые изменения';
    }

    function viewPlaces() {
        const rows = draftPlaces.map((p, idx) => {
            const bind = (key, cls, ph, extra) => h('input', {
                class: 'field ' + cls, value: p[key] || '', placeholder: ph, ...extra,
                'aria-label': ph,
                oninput: (e) => { p[key] = e.target.value; markDirty(); },
            });
            return h('div', { class: 'place-row' + (p.active === false ? ' off' : '') },
                bind('emoji', 'emoji', 'Эмодзи', { maxlength: 8 }),
                bind('name', 'name', 'Название', { maxlength: 40 }),
                bind('desc', 'desc', 'Короткое описание', { maxlength: 80 }),
                bind('address', 'addr', 'Адрес (необязательно)', { maxlength: 120 }),
                h('div', { class: 'place-ctrl' },
                    h('label', {}, h('input', { type: 'checkbox', checked: p.active !== false,
                        onchange: (e) => { p.active = e.target.checked; markDirty(); render(); } }), 'Показывать'),
                    h('button', { class: 'btn small', text: '↑', 'aria-label': 'Выше', disabled: idx === 0, onclick: () => move(idx, -1) }),
                    h('button', { class: 'btn small', text: '↓', 'aria-label': 'Ниже', disabled: idx === draftPlaces.length - 1, onclick: () => move(idx, 1) }),
                    h('button', { class: 'btn small danger', text: 'Удалить', onclick: () => { draftPlaces.splice(idx, 1); markDirty(); render(); } })
                ));
        });

        return h('section', { class: 'panel' },
            h('h2', { text: 'Места для выбора' }),
            h('p', { class: 'muted', style: 'margin-bottom:8px', text: 'Эти места видят все получатели приглашений. Скрытое место остаётся в статистике, но недоступно для выбора.' }),
            rows.length ? rows : h('p', { class: 'empty', text: 'Мест нет. Добавь хотя бы одно.' }),
            h('div', { class: 'save-bar' },
                h('button', { class: 'btn', text: '+ Добавить место', onclick: () => { draftPlaces.push({ id: '', emoji: '📍', name: '', desc: '', address: '', active: true }); markDirty(); render(); } }),
                h('button', { class: 'btn primary', id: 'saveBtn', text: 'Сохранить места', disabled: !dirty, onclick: savePlaces }),
                h('span', { class: 'muted', id: 'dirtyMsg', text: dirty ? 'Есть несохранённые изменения' : '' }))
        );
    }

    function move(idx, d) {
        const j = idx + d;
        if (j < 0 || j >= draftPlaces.length) return;
        [draftPlaces[idx], draftPlaces[j]] = [draftPlaces[j], draftPlaces[idx]];
        markDirty();
        render();
    }

    async function savePlaces() {
        try {
            const res = await api('save_places', { places: draftPlaces });
            draftPlaces = res.places.map((p) => ({ ...p }));
            dirty = false;
            await load();
            toast('Места сохранены');
        } catch (e) {
            toast(e.message, 'error');
        }
    }

    window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

    // ---------- старт ----------
    if (password) load().catch(() => renderLogin());
    else renderLogin();
})();
</script>
</body>
</html>
