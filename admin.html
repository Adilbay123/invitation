<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель • Приглашения</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

  <div id="loginScreen" style="max-width: 400px; margin: 100px auto; background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid var(--border);">
    <h2>Вход в админку</h2>
    <p>Введите пароль администратора</p>
    <div class="form-group">
      <input type="password" id="adminPasswordInput" placeholder="Пароль">
    </div>
    <button class="btn" id="btnLogin">Войти</button>
  </div>

  <div id="adminApp" style="display: none;">
    <div class="admin-header">
      <h2>🛠 Админ-панель</h2>
      <button class="btn btn-secondary" id="btnLogout" style="width: auto; padding: 8px 16px;">Выйти</button>
    </div>

    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="stats">Статистика</button>
      <button class="tab-btn" data-tab="invites">Приглашения</button>
      <button class="tab-btn" data-tab="places">Места</button>
    </div>

    <!-- Вкладка Статистика -->
    <div class="admin-panel active" id="panel-stats">
      <h3>Воронка событий</h3>
      <div id="statsTotal" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px;"></div>
      
      <h3>Популярные места</h3>
      <div id="statsPlaces" style="background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px;"></div>

      <h3>Последние события</h3>
      <div id="eventsList" style="background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px;"></div>
    </div>

    <!-- Вкладка Приглашения -->
    <div class="admin-panel" id="panel-invites">
      <h3>Список приглашений</h3>
      <div style="margin-bottom: 12px;">
        <input type="text" id="inviteSearch" placeholder="Поиск по имени...">
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Кому</th>
              <th>От кого</th>
              <th>Статус</th>
              <th>Создано</th>
              <th>Ответ</th>
              <th>Нет</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="invitesTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Вкладка Места -->
    <div class="admin-panel" id="panel-places">
      <h3>Управление местами</h3>
      <p>Настройте доступные для выбора места встреч.</p>
      <div id="placesEditorList" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;"></div>
      <button class="btn btn-secondary" id="btnAddPlace">+ Добавить место</button>
      <button class="btn" id="btnSavePlaces" style="margin-top: 16px;">Сохранить изменения</button>
    </div>
  </div>

  <script>
    let adminPassword = localStorage.getItem('admin_pass') || '';

    if (adminPassword) {
      checkAuth(adminPassword);
    }

    document.getElementById('btnLogin').addEventListener('click', () => {
      const pass = document.getElementById('adminPasswordInput').value;
      checkAuth(pass);
    });

    document.getElementById('btnLogout').addEventListener('click', () => {
      localStorage.removeItem('admin_pass');
      location.reload();
    });

    async function checkAuth(pass) {
      try {
        const res = await fetch('/api/admin?action=stats', {
          headers: { 'x-admin-password': pass }
        });
        if (res.ok) {
          adminPassword = pass;
          localStorage.setItem('admin_pass', pass);
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('adminApp').style.display = 'block';
          loadStats();
        } else {
          alert('Неверный пароль');
        }
      } catch (e) {
        alert('Ошибка соединения');
      }
    }

    // Переключение вкладок
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.getAttribute('data-tab');
        document.getElementById(`panel-${tab}`).classList.add('active');

        if (tab === 'stats') loadStats();
        if (tab === 'invites') loadInvites();
        if (tab === 'places') loadPlaces();
      });
    });

    async function loadStats() {
      const res = await fetch('/api/admin?action=stats', { headers: { 'x-admin-password': adminPassword } });
      const data = await res.json();

      const totalDiv = document.getElementById('statsTotal');
      const t = data.total || {};
      totalDiv.innerHTML = `
        <div style="background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border);">
          <div style="font-size: 24px; font-weight: 700; color: var(--accent);">${t.created || 0}</div>
          <div style="color: var(--text-muted); font-size: 13px;">Создано</div>
        </div>
        <div style="background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border);">
          <div style="font-size: 24px; font-weight: 700; color: var(--accent);">${t.open || 0}</div>
          <div style="color: var(--text-muted); font-size: 13px;">Открыто</div>
        </div>
        <div style="background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border);">
          <div style="font-size: 24px; font-weight: 700; color: var(--accent);">${t.answer || 0}</div>
          <div style="color: var(--text-muted); font-size: 13px;">Ответили</div>
        </div>
        <div style="background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border);">
          <div style="font-size: 24px; font-weight: 700; color: var(--accent);">${t.note || 0}</div>
          <div style="color: var(--text-muted); font-size: 13px;">Записки</div>
        </div>
      `;

      const placesDiv = document.getElementById('statsPlaces');
      placesDiv.innerHTML = Object.entries(data.placesStats || {}).map(([p, cnt]) => `<div><b>${p}</b>: ${cnt} раз(а)</div>`).join('') || 'Нет данных';

      const eventsDiv = document.getElementById('eventsList');
      eventsDiv.innerHTML = (data.events || []).map(e => `<div>[${new Date(e.at || Date.now()).toLocaleTimeString()}] ${e.type} (${e.uid || ''})</div>`).join('');
    }

    async function loadInvites() {
      const res = await fetch('/api/admin?action=invites', { headers: { 'x-admin-password': adminPassword } });
      const data = await res.json();
      const tbody = document.getElementById('invitesTableBody');
      tbody.innerHTML = '';

      (data.invites || []).forEach(inv => {
        const tr = document.createElement('tr');
        let status = '⏳ Ждёт';
        if (inv.answer) status = '✅ Согласен(-на)';
        else if (Number(inv.openedAt) > 0) status = '👁 Открыто';

        tr.innerHTML = `
          <td>${escapeHtml(inv.toName)}</td>
          <td>${escapeHtml(inv.fromName)}</td>
          <td>${status}</td>
          <td>${new Date(Number(inv.createdAt)).toLocaleDateString()}</td>
          <td>${inv.answer ? `${inv.answer.date} ${inv.answer.time} (${inv.answer.placeName})` : '-'}</td>
          <td>${inv.noClicks || 0}</td>
          <td><button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px; width: auto;" onclick="deleteInvite('${inv.uid}')">Удалить</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteInvite(uid) {
      if (!confirm('Точно удалить это приглашение?')) return;
      await fetch(`/api/admin?action=invites&uid=${uid}`, {
        method: 'DELETE',
        headers: { 'x-admin-password': adminPassword }
      });
      loadInvites();
    }

    let currentPlaces = [];
    async function loadPlaces() {
      const res = await fetch('/api/admin?action=places', { headers: { 'x-admin-password': adminPassword } });
      const data = await res.json();
      currentPlaces = data.places || [];
      renderPlacesEditor();
    }

    function renderPlacesEditor() {
      const container = document.getElementById('placesEditorList');
      container.innerHTML = '';
      currentPlaces.forEach((p, idx) => {
        const div = document.createElement('div');
        div.style.cssText = 'background: var(--card-bg); border: 1px solid var(--border); padding: 12px; border-radius: 12px; display: grid; grid-template-columns: 60px 1fr 1fr 1fr auto; gap: 8px; align-items: center;';
        div.innerHTML = `
          <input type="text" value="${p.emoji}" onchange="currentPlaces[${idx}].emoji = this.value">
          <input type="text" value="${p.name}" onchange="currentPlaces[${idx}].name = this.value">
          <input type="text" value="${p.desc}" onchange="currentPlaces[${idx}].desc = this.value">
          <input type="text" value="${p.address}" onchange="currentPlaces[${idx}].address = this.value">
          <button class="btn btn-danger" style="width: auto; padding: 8px;" onclick="currentPlaces.splice(${idx}, 1); renderPlacesEditor();">✕</button>
        `;
        container.appendChild(div);
      });
    }

    document.getElementById('btnAddPlace').addEventListener('click', () => {
      currentPlaces.push({ id: 'p_' + Math.random().toString(36).substr(2, 5), name: 'Новое место', emoji: '✨', desc: 'Описание', address: 'Адрес', active: true });
      renderPlacesEditor();
    });

    document.getElementById('btnSavePlaces').addEventListener('click', async () => {
      const res = await fetch('/api/admin?action=places', {
        method: 'POST',
        headers: { 'x-admin-password': adminPassword, 'Content-Type': 'application/json' },
        body: JSON.stringify({ places: currentPlaces })
      });
      if (res.ok) alert('Места успешно сохранены!');
      else alert('Ошибка сохранения');
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
